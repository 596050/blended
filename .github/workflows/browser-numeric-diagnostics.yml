name: Diagnose Blender native and browser numerical differences

on:
  push:
    branches: [main, 'parity/**']
    paths:
      - tools/probe_numeric_diagnostics.py
      - tools/blender_numeric_diagnostics.py
      - tools/probe_browser_port.py
      - tools/probe_native_reference.py
      - tests/test_numeric_diagnostics_probe.py
      - .github/workflows/browser-numeric-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify transport, identity, input pairing, and diagnostic scope
        run: python3 -m unittest discover -s tests -p test_numeric_diagnostics_probe.py -v

  diagnostic:
    name: Collect ${{ matrix.engine }} diagnostic observations
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [native, browser]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        if: matrix.engine == 'browser'
        run: python3 -m pip install playwright==1.57.0
      - name: Execute identical non-acceptance payload on verified artifact
        run: >-
          python3 tools/probe_numeric_diagnostics.py run
          --engine ${{ matrix.engine }}
          --output evidence/${{ matrix.engine }}
          --timeout 240
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-diagnostics-${{ matrix.engine }}
          path: evidence/${{ matrix.engine }}/
          retention-days: 14

  comparison:
    name: Pair identical inputs and retain numerical differences
    needs: diagnostic
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: numeric-diagnostics-native
          path: evidence/native
      - uses: actions/download-artifact@v4
        with:
          name: numeric-diagnostics-browser
          path: evidence/browser
      - name: Compare without accepting unknown provenance or modifying tolerances
        run: >-
          python3 tools/probe_numeric_diagnostics.py compare
          --native evidence/native/native-numeric-diagnostics.json
          --browser evidence/browser/browser-numeric-diagnostics.json
          --output evidence/comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-diagnostics-comparison
          path: evidence/comparison/
          retention-days: 14

  preserve-evidence:
    name: Append diagnostic receipts without promoting acceptance status
    needs: [diagnostic, comparison]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: numeric-diagnostics-evidence
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: numeric-diagnostics-*
          path: receipts
      - name: Preserve diagnostics in a separate evidence branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test -d receipts
          git init --initial-branch=numeric-diagnostics-evidence published
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin numeric-diagnostics-evidence >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin numeric-diagnostics-evidence
            git -C published reset --hard FETCH_HEAD
          fi
          DESTINATION="published/${SOURCE_SHA}/${RUN_ID}"
          mkdir -p "$DESTINATION"
          cp -a receipts/. "$DESTINATION/"
          git -C published add -A
          git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Preserve numeric diagnostics ${RUN_ID} at ${SOURCE_SHA}"
          git -C published push origin HEAD:refs/heads/numeric-diagnostics-evidence
