name: Preserve map-view source reproduction dependencies
on:
  push:
    branches: [compat/multimap-and-erased-spans]
    paths: ['.github/workflows/container-view-registration.yml']
permissions:
  contents: write
jobs:
  source-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply the exact reviewed source-archive manifest change
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('tools/port_workbench.py');raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='abe86e6f9b2a3ab2d3fb1a14e788b119fe6b4590', 'Archive baseline changed'
          old="('crates','tools','tests','compatibility','docs','LICENSES','Cargo.toml','Cargo.lock','rust-toolchain.toml','NOTICE.md','upstream.lock.json')"
          new="('.github','crates','tools','tests','compatibility','docs','LICENSES','Cargo.toml','Cargo.lock','rust-toolchain.toml','NOTICE.md','upstream.lock.json','evidence/mask-oracle-domain-failure.json','evidence/container-oracle-reference-limit.json')"
          text=raw.decode();assert text.count(old)==1
          for name in ('.github/workflows/test-port-conformance.yml','.github/workflows/port-inventory-integrity.yml','evidence/mask-oracle-domain-failure.json','evidence/container-oracle-reference-limit.json'):
              assert Path(name).is_file(), 'Missing source regression dependency: '+name
          p.write_text(text.replace(old,new))
          PY
          python3 tools/prepare_site.py
          python3 -m unittest discover -s tests -v
      - name: Commit only the checked source-manifest edit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add tools/port_workbench.py
          gh auth setup-git
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Include workflow and small reference-limit fixtures needed by source-archive regression tests, without bundling large runtime evidence'
          git push origin HEAD:refs/heads/compat/multimap-and-erased-spans
