name: Pinned source diagnostic bundle
on:
  push:
    branches: ['diagnostics/source-bundle']
    paths: ['.github/workflows/source-bundle.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 tools/fetch_upstreams.py solarxy
          mkdir -p evidence/source
          git -C .upstream/solarxy archive --format=zip --output="$GITHUB_WORKSPACE/evidence/source/solarxy-pinned.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-diagnostic-source
          path: evidence/source/
          retention-days: 1
