name: Publish verified Blender parity checkpoint f25e69ed72fe

on:
  push:
    branches: ['checkpoint/import-f25e69ed72fe']
    paths:
      - checkpoint-f25e69ed72fe/**
      - .github/workflows/import-checkpoint-f25e69ed72fe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checkpoint-import-f25e69ed72fe
  cancel-in-progress: false

jobs:
  publish:
    name: Verify exact bundle and publish with a branch lease
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub's existing repository-scoped credential helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git
      - name: Verify chunk hashes, bundle, commit, tree and remote branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: >-
          python3 checkpoint-f25e69ed72fe/import_checkpoint.py
          --manifest checkpoint-f25e69ed72fe/manifest.json
          --chunks-root .
          --work-dir '${{ runner.temp }}/checkpoint-f25e69ed72fe'
          --push
      - name: Preserve publication receipt and raw command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-publication-f25e69ed72fe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/checkpoint-f25e69ed72fe/receipt.json
            ${{ runner.temp }}/checkpoint-f25e69ed72fe/commands/
            ${{ runner.temp }}/checkpoint-f25e69ed72fe/error.log
          retention-days: 14
          if-no-files-found: error
