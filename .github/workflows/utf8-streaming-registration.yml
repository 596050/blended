name: Register full UTF8 transcript infrastructure
on:
  push:
    branches: [compat/utf8-boundaries]
    paths: ['.github/workflows/utf8-streaming-registration.yml']
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check bounded-memory source changes
        run: |
          set -euo pipefail
          python3 tools/enable_utf8_streaming.py
          git restore .github/workflows/assertion-fidelity.yml .github/workflows/test-port-conformance.yml
          python3 tools/prepare_site.py
          python3 -m unittest discover -s tests -v
      - name: Commit only source changes allowed by the Actions token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add tools/assertion_fidelity.py tools/fidelity/trace.rs
          gh auth setup-git
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Use full-event streaming comparator and avoid duplicate in-memory browser transcripts; workflow integration follows separately'
          git push origin HEAD:refs/heads/compat/utf8-boundaries
