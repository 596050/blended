name: Compile UTF8 implementation with original tables
on:
  push:
    branches: [compat/utf8-boundaries]
    paths: ['.github/workflows/utf8-tables.yml']
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Generate original combining intervals and execute all translated tests
        run: |
          set -euo pipefail
          mkdir -p evidence/utf8-compile
          python3 tools/fetch_upstreams.py blender
          python3 tools/generate_utf8_tables.py
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/utf8-compile/native.txt
          cargo build --locked --release --target wasm32-unknown-unknown -p blended-core 2>&1 | tee evidence/utf8-compile/wasm-build.txt
      - name: Commit deterministic table and attribution only after successful compilation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add crates/blended-core/src/utf8_combining.rs LICENSES/wcwidth-original-notice.txt
          gh auth setup-git
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Preserve original combining intervals and licence after all native UTF8 cases compile and pass'
          git push origin HEAD:refs/heads/compat/utf8-boundaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utf8-compile-evidence
          path: evidence/utf8-compile/
          retention-days: 3
