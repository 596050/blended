name: String operations original-test-first evidence
on:
  push:
    branches: [compat/string-operations]
    paths: ['tools/register_string_ops_batch.py', '.github/workflows/string-ops-test-first.yml']
permissions:
  contents: write
jobs:
  test-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Register reviewed tests while implementation modules are absent
        run: |
          set -euo pipefail
          test ! -f crates/blended-core/src/string_ops.rs
          test ! -f crates/blended-core/src/string_search.rs
          python3 tools/fetch_upstreams.py blender
          python3 tools/register_string_ops_batch.py
      - name: Commit original cases and assertion contracts before implementation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add crates tools compatibility tests
          gh auth setup-git
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Register 48 complete original string fixture cases before implementation; execution pending'
          git push origin HEAD:refs/heads/compat/string-operations
      - name: Execute the missing implementation without suppressing failure
        run: |
          set -euo pipefail
          mkdir -p evidence/string-ops-test-first
          git rev-parse HEAD > evidence/string-ops-test-first/source-commit.txt
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/string-ops-test-first/native.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: string-ops-test-first-evidence
          path: evidence/string-ops-test-first/
          retention-days: 3
