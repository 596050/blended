name: Rust compatibility TDD
on:
  push:
    branches: ['compat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Execute Rust tests without suppressing expected red failures
        run: |
          mkdir -p evidence/tdd
          set -o pipefail
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/tdd/native.txt
      - name: Build browser core
        run: cargo build --locked --release --target wasm32-unknown-unknown -p blended-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-tdd-evidence
          path: evidence/tdd
          retention-days: 3
