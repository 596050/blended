name: Port inventory integrity, not full-suite completion
on:
  push:
    branches: [main, 'compat/**', 'quality/**']
    paths: ['tools/inventory.py', 'tools/test_port_audit.py', 'tools/port_registry.py', 'tools/port_workbench.py', 'tests/test_cpp_number_lexing.py', 'tests/test_collection_port.py', 'compatibility/**', '.github/workflows/port-inventory-integrity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test inventory and fidelity failure detection
        run: |
          python3 tools/prepare_site.py
          python3 -m unittest discover -s tests -v
      - name: Reconcile all mapped identities with the complete pinned source checkout
        run: |
          set -euo pipefail
          python3 tools/fetch_upstreams.py blender
          python3 tools/inventory.py --root .upstream/blender --name blender --commit 94363991e7dcf39e2d70614aa002ab6f67764a5d --output build/blender-inventory.json
          python3 tools/test_port_audit.py --inventory build/blender-inventory.json --output evidence/inventory-integrity/audit.json
          python3 - <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          sys.path.insert(0,'tools')
          from test_port_audit import key,load_ports
          from port_workbench import expected_cases
          inv=json.load(open('build/blender-inventory.json'))
          ports=load_ports(inv)
          source_keys=[key(c) for c in inv['cases']]
          port_keys=[key(c) for c in ports]
          assert len(set(source_keys))==len(source_keys), 'Ambiguous source identities'
          assert len(set(port_keys))==len(port_keys), 'Duplicate port mappings'
          expected,_=expected_cases()
          static=json.load(open('compatibility/compile-time-ports.json'))['cases']
          runtime_ports=[p for p in ports if p.get('kind')!='static_assert']
          static_ports=[p for p in ports if p.get('kind')=='static_assert']
          assert expected and len(runtime_ports)==len(expected)
          assert {p['id'] for p in runtime_ports}=={c['id'] for c in expected}
          assert len(static_ports)==len(static)==6
          assert {(p['path'],p['id']) for p in static_ports}=={(c['path'],c['id']) for c in static}
          assert len(port_keys)==len(expected)+len(static) and set(port_keys)<=set(source_keys), 'Missing mapped source test'
          assert all(p['semantics_reviewed'] for p in ports), 'Source/target assertion contract changed'
          report=json.load(open('evidence/inventory-integrity/audit.json'))
          assert report['mapped_source_candidates']==len(port_keys)
          assert report['complete_test_port'] is False, 'Do not certify full-suite completion from this integrity check'
          summary={k:report[k] for k in ['reference_commit','source_candidates','mapped_source_candidates','unported_source_candidates','complete_test_port','blockers']}
          summary.update(status='passed',scope='Identity integrity of the independently registered runtime and compile-time subsets; not complete Blender port',runtime_mappings=len(expected),compile_time_mappings=len(static),source_commit='${{ github.sha }}',scanner_sha256=hashlib.sha256(Path('tools/inventory.py').read_bytes()).hexdigest())
          Path('evidence/inventory-integrity/summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-integrity-evidence
          path: evidence/inventory-integrity/
          retention-days: 1
