name: Pixel formats original-test-first evidence
on:
  push:
    branches: [compat/half-and-normalised-formats]
    paths: ['.github/workflows/pixel-formats-test-first.yml']
permissions:
  contents: write
jobs:
  test-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Register original tests while the implementation module is absent
        run: |
          set -euo pipefail
          test ! -f crates/blended-core/src/pixel_formats.rs
          python3 tools/fetch_upstreams.py blender
          python3 tools/register_pixel_format_batch.py
      - name: Commit reviewed source cases before implementation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add crates tools compatibility tests
          gh auth setup-git
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Register all enabled half and normalised-int cases before implementation; performance cases explicitly remain unported'
          git push origin HEAD:refs/heads/compat/half-and-normalised-formats
      - name: Execute the missing implementation without suppressing failure
        run: |
          set -euo pipefail
          mkdir -p evidence/pixel-formats-test-first
          git rev-parse HEAD > evidence/pixel-formats-test-first/source-commit.txt
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/pixel-formats-test-first/native.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-formats-test-first-evidence
          path: evidence/pixel-formats-test-first/
          retention-days: 3
