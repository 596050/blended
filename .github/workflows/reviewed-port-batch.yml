name: Apply reviewed numeric and text test batch
on:
  push:
    branches: [compat/numerics-and-text]
    paths: ['.porting/next.json.gz', '.github/workflows/reviewed-port-batch.yml']
permissions:
  contents: write
concurrency:
  group: reviewed-numerics-text-batch
  cancel-in-progress: false
jobs:
  test-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Recover checksum-locked transport data before parsing or executing it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/596050/blended/git/blobs/1d853f4f5be5a72f7dfa4cbdda8efddb7281bc2f > /tmp/source-transfer.json
          python3 - <<'PY'
          import base64,hashlib,json,pathlib
          if not pathlib.Path('.porting/next.json.gz').exists():
              text=''.join(json.loads(pathlib.Path('/tmp/source-transfer.json').read_text())['content'].split())
              for old,new in [('TECpDwE7U7hytnkw','TECpDwE7Uhytnkw'),('nwR9N+gO/j7nD049','nwR9N+gO/J7nD049'),('NB29aTiq3U8t2','NB29aTiq3UQ8t2')]:
                  assert text.count(old)==1,old
                  text=text.replace(old,new)
              data=base64.b64decode(text,validate=True)
              assert hashlib.sha256(data).hexdigest()=='39d2916e93900866bffce8e970d786823f19ffcdedd72ac9f12aa0cb371ef546','Transport digest mismatch: do not execute'
              pathlib.Path('.porting').mkdir(exist_ok=True)
              pathlib.Path('.porting/next.json.gz').write_bytes(data)
          PY
      - name: Apply exact reviewed files, refusing stale preimages or workflow changes
        run: |
          python3 - <<'PY'
          import gzip,hashlib,json,pathlib
          bundle=json.loads(gzip.decompress(pathlib.Path('.porting/next.json.gz').read_bytes()))
          seen=set()
          for entry in bundle['files']:
              p=pathlib.Path(entry['path'])
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in ('tools','crates','tests','compatibility','docs','evidence'),p
              assert p.as_posix() not in seen,p
              seen.add(p.as_posix())
              before=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert before==entry['before_sha256'],(p,before,entry['before_sha256'])
              data=entry['content'].encode()
              assert hashlib.sha256(data).hexdigest()==entry['after_sha256']
          for entry in bundle['files']:
              p=pathlib.Path(entry['path']);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(entry['content'])
          PY
          python3 tools/fetch_upstreams.py blender
          python3 tools/port_numerics_text_tests.py
      - name: Commit exact test sources before running their implementations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add crates tools tests compatibility docs evidence
          gh auth setup-git
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Land 93 reviewed numeric/text runtime cases before supplying their implementation'
          git push origin HEAD:refs/heads/compat/numerics-and-text
      - name: Execute tests without masking test-first failures
        run: |
          set -o pipefail
          mkdir -p evidence/numerics-text-tdd
          git rev-parse HEAD > evidence/numerics-text-tdd/commit.txt
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/numerics-text-tdd/native.log
      - name: Build real WebAssembly
        run: cargo build --locked --release --target wasm32-unknown-unknown -p blended-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerics-text-tdd
          path: evidence/numerics-text-tdd/
          retention-days: 3
