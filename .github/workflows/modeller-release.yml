name: Build and verify Three.js modeller alpha
on:
  push:
    branches: [compat/three-viewport, main]
    paths: ['modeller/**', 'crates/blended-core/**', 'tools/build_modeller.py', 'tools/test_modeller.py', '.github/workflows/modeller-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build after native and state-history tests pass
        run: |
          mkdir -p evidence/build
          set -o pipefail
          python3 tools/build_modeller.py --commit "${{ github.sha }}" 2>&1 | tee evidence/build/log.txt
      - run: python3 -m pip install playwright==1.57.0 pillow==11.3.0
      - name: Execute actual rendering and editing workflows before deployment
        timeout-minutes: 5
        run: |
          python3 -m http.server 8765 --directory build/modeller >/tmp/modeller-http.log 2>&1 &
          python3 tools/test_modeller.py --url http://127.0.0.1:8765/index.html --commit "${{ github.sha }}" --output evidence/predeploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modeller-predeploy-evidence
          path: evidence/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: modeller-site
          path: build/modeller/
          include-hidden-files: true
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modeller-site
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: modeller-predeploy-evidence
          path: site/verification
      - name: Publish the passing limited modeller, separately from the failed WebGPU experiment
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init --initial-branch=modeller-build published
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin modeller-build >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin modeller-build
            git -C published reset --mixed FETCH_HEAD
          fi
          cp -a site/. published/
          git -C published add -A
          git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m "Publish limited modeller alpha ${SOURCE_SHA} with passing predeployment tests"
          git -C published push origin HEAD:refs/heads/modeller-build
          SHA=$(git -C published rev-parse HEAD)
          URL="https://rawcdn.githack.com/${REPO}/${SHA}/index.html"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Limited modeller alpha: ${URL}" >> "$GITHUB_STEP_SUMMARY"
  deployed-test:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.57.0 pillow==11.3.0
      - name: Test the public deployed URL, not a local surrogate
        timeout-minutes: 6
        run: python3 tools/test_modeller.py --url "${{ needs.publish.outputs.url }}" --commit "${{ github.sha }}" --output evidence/deployed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modeller-public-evidence
          path: evidence/deployed/
          retention-days: 3
      - name: Preserve public results and screenshots in the repository
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          URL: ${{ needs.publish.outputs.url }}
        run: |
          test -f evidence/deployed/result.json
          printf '%s\n' "$URL" > evidence/deployed/deployment-url.txt
          git init --initial-branch=modeller-evidence published
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin modeller-evidence >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin modeller-evidence
            git -C published reset --mixed FETCH_HEAD
          fi
          cp -a evidence/deployed/. published/
          git -C published add -A
          git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m 'Preserve real deployed modeller acceptance results'
          git -C published push origin HEAD:refs/heads/modeller-evidence
