name: Blender test-port conformance
on:
  push:
    branches: [compat/complete-test-port, compat/ranges-bounds, main]
    paths: ['crates/**', 'compatibility/**', 'tools/port_scalar_tests.py', 'tools/port_structure_tests.py', 'tools/test_port_audit.py', 'tools/port_workbench.py', 'tests/test_test_port_audit.py', 'tests/test_structure_port.py', 'tests/test_port_workbench.py', '.github/workflows/test-port-conformance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Verify committed ports reproduce from pinned upstream files
        run: |
          python3 tools/fetch_upstreams.py blender
          python3 tools/port_scalar_tests.py
          python3 tools/port_structure_tests.py
          git diff --exit-code -- crates/blended-core/src/additional_cases.rs crates/blended-core/tests/upstream_additional.rs compatibility/additional-ports.json crates/blended-core/src/structure_cases.rs crates/blended-core/tests/upstream_structures.rs compatibility/structure-ports.json tests/upstream
      - name: Run native tests without ignoring missing implementations
        run: |
          mkdir -p evidence
          set -o pipefail
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/native.txt
      - name: Build the same tests for actual browser execution
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p blended-core
          python3 tools/port_workbench.py build --commit "${{ github.sha }}"
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'tools')
          from test_port_audit import load_ports
          from port_workbench import expected_cases
          ports=load_ports(json.load(open('build/blender-inventory.json')))
          expected,_=expected_cases()
          assert len(ports)==len(expected)==99 and all(p['semantics_reviewed'] for p in ports), 'Reviewed assertion contract changed; do not publish'
          assert {p['id'] for p in ports}=={p['id'] for p in expected}, 'Audit and executable registries diverged'
          PY
          python3 -m unittest discover -s tests -v
          python3 -m pip install playwright==1.57.0
          python3 -m http.server 8765 --directory build/conformance >/tmp/http.log 2>&1 &
          python3 tools/port_workbench.py test --url http://127.0.0.1:8765/ --commit "${{ github.sha }}" --output evidence/browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-test-port-evidence
          path: |
            evidence/
            compatibility/additional-ports.json
            compatibility/structure-ports.json
            crates/blended-core/src/additional_cases.rs
            crates/blended-core/src/structure_cases.rs
            crates/blended-core/tests/upstream_additional.rs
            crates/blended-core/tests/upstream_structures.rs
            tests/upstream/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-site
          path: build/conformance/
          retention-days: 3
  full-test-port-completeness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory all pinned Blender source tests and retain unported cases
        run: |
          python3 tools/fetch_upstreams.py blender
          python3 tools/port_scalar_tests.py
          python3 tools/port_structure_tests.py
          python3 tools/inventory.py --root .upstream/blender --name blender --commit 94363991e7dcf39e2d70614aa002ab6f67764a5d --output build/blender-inventory.json
          python3 tools/test_port_audit.py --inventory build/blender-inventory.json --output evidence/complete-test-port.json --require-complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-test-port-status
          path: |
            evidence/complete-test-port.json
            build/blender-inventory.json
          retention-days: 3
  publish-subset-workbench:
    needs: native-and-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: conformance-site
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: blender-test-port-evidence
          path: site/verification
      - name: Read immutable verified fixture metadata, not an expiring Actions artifact
        uses: actions/checkout@v4
        with:
          ref: 950ea85b0f4438bc5e082a0f9a402973f01d4de3
          path: fixture-store
          sparse-checkout: fixture-evidence
          persist-credentials: false
      - run: cp -a fixture-store/fixture-evidence site/
      - name: Publish only the verified subset, explicitly not full completion
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init --initial-branch=test-port-build published
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin test-port-build >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin test-port-build
            git -C published reset --mixed FETCH_HEAD
          fi
          cp -a site/. published/
          git -C published add -A
          git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m "Publish 99-case Blender conformance subset ${SOURCE_SHA}; full test port incomplete"
          git -C published push origin HEAD:refs/heads/test-port-build
          SHA=$(git -C published rev-parse HEAD)
          echo "url=https://rawcdn.githack.com/${REPO}/${SHA}/index.html" >> "$GITHUB_OUTPUT"
  deployed-subset-test:
    needs: publish-subset-workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.57.0
      - name: Execute every mapped case at the actual immutable public URL
        run: python3 tools/port_workbench.py test --url "${{ needs.publish-subset-workbench.outputs.url }}" --commit "${{ github.sha }}" --output evidence/deployed-port/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-test-port-evidence
          path: evidence/deployed-port/
          retention-days: 3
      - name: Preserve public test evidence beyond artifact expiry
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          URL: ${{ needs.publish-subset-workbench.outputs.url }}
        run: |
          test -f evidence/deployed-port/result.json
          printf '%s\n' "$URL" > evidence/deployed-port/deployment-url.txt
          git init --initial-branch=test-port-evidence published
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin test-port-evidence >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin test-port-evidence
            git -C published reset --mixed FETCH_HEAD
          fi
          cp -a evidence/deployed-port/. published/
          git -C published add -A
          git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m 'Preserve deployed Blender test-port subset results'
          git -C published push origin HEAD:refs/heads/test-port-evidence
