name: Blender test-port conformance
on:
  push:
    branches: [main, 'compat/**', 'quality/**']
    paths: ['crates/**', 'compatibility/**', 'tools/port_*.py', 'tools/verify_static_port.py', 'tools/verify_embedded_static_ports.py', 'tools/verify_heap_*.py', 'tools/inventory.py', 'tools/verify_zero_assertion_case.py', 'tools/test_port_audit.py', 'tools/assertion_fidelity.py', 'tools/fidelity/**', 'tests/**', '.github/workflows/assertion-fidelity.yml', '.github/workflows/test-port-conformance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assertion-fidelity:
    permissions:
      contents: write
    uses: ./.github/workflows/assertion-fidelity.yml
  native-and-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Reproduce every registered test from its pinned original source
        run: |
          set -euo pipefail
          python3 tools/fetch_upstreams.py blender
          python3 - <<'PY'
          import subprocess,sys
          sys.path.insert(0,'tools')
          from port_registry import GROUPS
          for generator in dict.fromkeys(g.generator for g in GROUPS):
              subprocess.run([sys.executable,'tools/'+generator],check=True)
          PY
          git diff --exit-code -- crates/blended-core/src crates/blended-core/tests compatibility tests/upstream
      - name: Run the unmodified native tests
        run: |
          mkdir -p evidence
          set -o pipefail
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/native.txt
      - name: Build production WebAssembly and verify the exact case universe
        run: |
          set -euo pipefail
          cargo build --locked --release --target wasm32-unknown-unknown -p blended-core
          python3 tools/port_workbench.py build --commit "${{ github.sha }}"
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from test_port_audit import load_ports
          from port_workbench import expected_cases
          from port_registry import verify_runtime_contract_bijection
          ports=load_ports(json.load(open('build/blender-inventory.json')))
          expected,_=expected_cases()
          verify_runtime_contract_bijection(Path.cwd(),expected)
          runtime_ports=[p for p in ports if p.get('kind')!='static_assert']
          static_ports=[p for p in ports if p.get('kind')=='static_assert']
          static_contract=json.load(open('compatibility/compile-time-ports.json'))['cases']
          assert expected and len(runtime_ports)==len(expected)
          assert len(static_contract)==6 and len(static_ports)==len(static_contract)
          assert {(p['path'],p['id']) for p in static_ports}=={(c['path'],c['id']) for c in static_contract}, 'Compile-time mapping lost or substituted'
          assert all(p['semantics_reviewed'] for p in ports), 'Reviewed assertion contract changed'
          assert {p['id'] for p in runtime_ports}=={p['id'] for p in expected}, 'Audit and executable registries diverged'
          PY
          python3 -m unittest discover -s tests -v
          python3 tools/verify_static_port.py --output evidence/static-port.json
          python3 tools/verify_embedded_static_ports.py --output evidence/embedded-static-ports.json
          python3 -m pip install playwright==1.57.0
          python3 tools/verify_zero_assertion_case.py --output evidence/zero-assertion-probe.json
          python3 tools/verify_heap_inputs.py --output evidence/heap-inputs/result.json
          python3 tools/verify_heap_sensitivity.py --output evidence/heap-sensitivity/result.json
          python3 -m http.server 8765 --directory build/conformance >/tmp/http.log 2>&1 &
          python3 tools/port_workbench.py test --url http://127.0.0.1:8765/ --commit "${{ github.sha }}" --output evidence/browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-test-port-evidence
          path: |
            evidence/
            compatibility/
            crates/blended-core/src/*cases.rs
            crates/blended-core/tests/upstream*.rs
            tests/upstream/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-site
          path: build/conformance/
          retention-days: 3
  full-test-port-completeness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain the complete source universe, including every unported case
        run: |
          set -euo pipefail
          python3 tools/fetch_upstreams.py blender
          python3 tools/inventory.py --root .upstream/blender --name blender --commit 94363991e7dcf39e2d70614aa002ab6f67764a5d --output build/blender-inventory.json
          python3 tools/test_port_audit.py --inventory build/blender-inventory.json --output evidence/complete-test-port.json --require-complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-test-port-status
          path: |
            evidence/complete-test-port.json
            build/blender-inventory.json
          retention-days: 3
  publish-subset-workbench:
    needs: [native-and-wasm, assertion-fidelity]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: conformance-site
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: blender-test-port-evidence
          path: site/verification
      - uses: actions/download-artifact@v4
        with:
          name: assertion-fidelity-comparisons
          path: site/assertion-fidelity
      - name: Read immutable verified fixture metadata
        uses: actions/checkout@v4
        with:
          ref: 950ea85b0f4438bc5e082a0f9a402973f01d4de3
          path: fixture-store
          sparse-checkout: fixture-evidence
          persist-credentials: false
      - run: cp -a fixture-store/fixture-evidence site/
      - name: Publish the verified subset without declaring whole-suite completion
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init --initial-branch=test-port-build published
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin test-port-build >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin test-port-build
            git -C published reset --mixed FETCH_HEAD
          fi
          cp -a site/. published/
          git -C published add -A
          git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m "Publish independently verified Blender conformance subset ${SOURCE_SHA}; full port incomplete"
          git -C published push origin HEAD:refs/heads/test-port-build
          SHA=$(git -C published rev-parse HEAD)
          echo "url=https://rawcdn.githack.com/${REPO}/${SHA}/index.html" >> "$GITHUB_OUTPUT"
  deployed-subset-test:
    needs: publish-subset-workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright==1.57.0
      - name: Execute every mapped case at the actual immutable public URL
        run: python3 tools/port_workbench.py test --url "${{ needs.publish-subset-workbench.outputs.url }}" --commit "${{ github.sha }}" --output evidence/deployed-port/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-test-port-evidence
          path: evidence/deployed-port/
          retention-days: 3
      - name: Preserve public test evidence beyond artifact expiry
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          URL: ${{ needs.publish-subset-workbench.outputs.url }}
        run: |
          set -euo pipefail
          test -f evidence/deployed-port/result.json
          printf '%s\n' "$URL" > evidence/deployed-port/deployment-url.txt
          git init --initial-branch=test-port-evidence published
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin test-port-evidence >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin test-port-evidence
            git -C published reset --mixed FETCH_HEAD
          fi
          cp -a evidence/deployed-port/. published/
          git -C published add -A
          git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m 'Preserve actual deployed Blender test-port subset results'
          git -C published push origin HEAD:refs/heads/test-port-evidence
