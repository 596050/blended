name: Inventory pinned upstream source tests
on:
  push:
    branches: [main, 'compat/**']
    paths:
      - upstream.lock.json
      - tools/inventory.py
      - tests/test_inventory.py
      - .github/workflows/upstream-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run inventory infrastructure tests
        run: python3 -m unittest discover -s tests -p test_inventory.py -v
      - name: Fetch pinned reference repositories
        run: python3 tools/fetch_upstreams.py blender cycles solarxy
      - name: Enumerate source candidates without inventing runtime results
        run: |
          mkdir -p evidence/inventory
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          from tools.inventory import inventory
          lock=json.loads(Path('upstream.lock.json').read_text())['upstreams']
          summary={}
          for name,entry in lock.items():
              result=inventory(Path('.upstream')/name,name,entry['commit'])
              Path(f'evidence/inventory/{name}.json').write_text(json.dumps(result,indent=2)+'\n')
              summary[name]={'source_candidates':len(result['cases']),'files_scanned':len(result['files']),'fixture_files':len(result['fixtures']),'unreadable_files':len(result['unreadable_files']),'runtime_enumeration_complete':False,'executed':0,'passed':0}
          Path('evidence/inventory/summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Retain complete discovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-test-inventory
          path: evidence/inventory
          retention-days: 3
