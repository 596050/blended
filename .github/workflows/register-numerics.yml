name: Register reviewed numeric and text ports
on:
  push:
    branches: [compat/numerics-and-text]
    paths: ['tools/install_numerics_batch.py', '.github/workflows/register-numerics.yml']
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Register only source-locked reviewed cases
        run: |
          set -euo pipefail
          python3 tools/fetch_upstreams.py blender
          python3 tools/install_numerics_batch.py
          python3 tools/prepare_site.py
          python3 -m unittest discover -s tests -v
          mkdir -p evidence/numerics-text
          cargo test --locked --workspace --all-targets > evidence/numerics-text/native.log 2>&1
          cargo build --locked --release --target wasm32-unknown-unknown -p blended-core
          python3 tools/assertion_fidelity.py shadow --output build/trace-shadow
          (cd build/trace-shadow && cargo run --locked --quiet -p blended-core --example assertion_trace) > evidence/numerics-text/native-trace.jsonl
      - name: Commit source and integration without claiming original-reference fidelity yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git rm tools/install_numerics_batch.py
          git add tools crates compatibility tests evidence/numerics-text
          gh auth setup-git
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Register 93 numeric/text ports with native execution; original-reference and public-browser verification pending'
          git push origin HEAD:refs/heads/compat/numerics-and-text
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-text-registration
          path: evidence/numerics-text/
          retention-days: 3
