name: Preserve verified Blender test corpus
on:
  push:
    branches: ['compat/full-blender-tests']
    paths: ['.github/workflows/preserve-verified-blender-corpus.yml', 'tools/corpus_git.py', 'tests/test_corpus_git.py']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: blender-test-corpus-publication
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Regression test byte-exact publication despite upstream Git attributes
        run: python3 -m unittest discover -s tests -p test_corpus_git.py -v
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39835982316
          name: original-blender-test-corpus
          path: corpus
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39835982316
          name: full-suite-existing-alpha-check
          path: corpus/current-alpha-smoke
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39835982316
          name: blender-suite-gate-regressions
          path: corpus/tooling-tests
      - name: Preserve actual producer provenance, without reclassifying the port
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('corpus');s=json.loads((root/'summary.json').read_text());f=json.loads((root/'fixture-audit.json').read_text());g=json.loads((root/'full-port-report.json').read_text())
          assert s['upstream_commit']=='94363991e7dcf39e2d70614aa002ab6f67764a5d'
          assert s['original_corpus_files']==8780 and f['statuses']=={'verified':6840}
          assert not g['test_port_complete'] and not g['feature_parity_proven']
          p={'schema':1,'producer_run':39835982316,'producer_commit':'69ff7d849a32a92c3d6365e35c15c13f12147feb','upstream_commit':s['upstream_commit'],'verified_original_files':8780,'verified_main_tree_lfs_objects':6840,'fixture_payloads_in_this_branch':False,'test_port_complete':False,'note':'Byte-exact corpus publication recovery. This is not a full test port or a reclassification of earlier results.'}
          (root/'provenance.json').write_text(json.dumps(p,indent=2)+'\n')
          PY
      - name: Publish raw Git blobs without newline, LFS or custom filter transformations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          git init --initial-branch=blender-test-corpus published
          git -C published config user.name "$GIT_AUTHOR_NAME"
          git -C published config user.email "$GIT_AUTHOR_EMAIL"
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin blender-test-corpus >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin blender-test-corpus
            git -C published reset --mixed FETCH_HEAD
          fi
          python3 tools/corpus_git.py --source corpus --repository published
          git -C published -c core.hooksPath=/dev/null commit --allow-empty -m 'Preserve byte-exact original Blender test sources and honest completion evidence'
          git -C published -c core.hooksPath=/dev/null push origin HEAD:refs/heads/blender-test-corpus
