name: Preserve verified Blender test corpus
on:
  push:
    branches: ['compat/full-blender-tests']
    paths: ['.github/workflows/preserve-verified-blender-corpus.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: blender-test-corpus-publication
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39835982316
          name: original-blender-test-corpus
          path: corpus
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39835982316
          name: full-suite-existing-alpha-check
          path: corpus/current-alpha-smoke
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39835982316
          name: blender-suite-gate-regressions
          path: corpus/tooling-tests
      - name: Validate the original upstream payload and preserve its true provenance
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('corpus')
          summary=json.loads((root/'summary.json').read_text())
          assert summary['upstream_commit']=='94363991e7dcf39e2d70614aa002ab6f67764a5d'
          index=json.loads((root/'tracked-files.json').read_text())
          count=0
          for item in index:
              if not item.get('included_in_corpus'):continue
              data=(root/'original'/item['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['git_oid'],item['path']
              count+=1
          assert count==summary['original_corpus_files']==8780
          fixtures=json.loads((root/'fixture-audit.json').read_text())
          assert fixtures['statuses']=={'verified':6840}
          gate=json.loads((root/'full-port-report.json').read_text())
          assert gate['test_port_complete'] is False
          assert gate['feature_parity_proven'] is False
          provenance={'schema':1,'producer_run':39835982316,'producer_commit':'69ff7d849a32a92c3d6365e35c15c13f12147feb','upstream_commit':summary['upstream_commit'],'verified_original_files':count,'verified_main_tree_lfs_objects':6840,'fixture_payloads_in_this_branch':False,'test_port_complete':False,'note':'Publication recovery only. This does not rerun or reclassify the original test evidence.'}
          (root/'provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          print(json.dumps(provenance,indent=2))
          PY
      - name: Commit original sources and actual result ledgers without replacing assertion outcomes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          git init --initial-branch=blender-test-corpus published
          git -C published config user.name "$GIT_AUTHOR_NAME"
          git -C published config user.email "$GIT_AUTHOR_EMAIL"
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin blender-test-corpus >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin blender-test-corpus
            git -C published reset --mixed FETCH_HEAD
          fi
          cp -a corpus/. published/
          git -C published add -A
          git -C published commit --allow-empty -m 'Preserve 8780 upstream Blender test files, verified fixture audit and explicit incomplete-port report'
          git -C published push origin HEAD:refs/heads/blender-test-corpus
