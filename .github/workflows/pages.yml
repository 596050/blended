name: Solarxy WebGPU experiment (known rendering blocker)
# Kept separate from the passing limited Three.js modeller. This experiment
# still has a failing render acceptance test and is not a production release.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 tools/prepare_site.py
          python3 -m unittest discover -s tests -v
          cargo test --locked --workspace --all-targets
          cargo build --locked --release --target wasm32-unknown-unknown -p blended-core
          cp target/wasm32-unknown-unknown/release/blended_core.wasm site/compat/
          python3 tools/fetch_upstreams.py solarxy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .upstream/solarxy
          cache-on-failure: true
          cache-workspace-crates: true
      - run: |
          VERSION=0.2.126
          curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz --strip-components=1 -C /usr/local/bin "wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
          mkdir -p evidence
          set -o pipefail
          python3 tools/build_studio.py --base ./ --commit "${{ github.sha }}" 2>&1 | tee evidence/studio-build.txt
      - run: python3 -m pip install playwright==1.57.0 pillow==11.3.0
      - name: Execute rendering gate without suppressing failures
        timeout-minutes: 7
        run: |
          python3 -m http.server 8765 --directory site >/tmp/http.log 2>&1 &
          python3 tools/browser_check.py --url http://127.0.0.1:8765/index.html --expected-commit "${{ github.sha }}" --output evidence/solarxy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solarxy-experiment-evidence
          path: evidence/
          retention-days: 3
