name: Range and bounds test-port TDD
on:
  push:
    branches: [compat/ranges-bounds]
    paths: ['tools/port_structure_tests.py', 'crates/**', '.github/workflows/structure-port.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - run: |
          python3 tools/fetch_upstreams.py blender
          python3 tools/port_structure_tests.py
      - name: Execute all new ports with their original assertions
        run: |
          mkdir -p evidence/structures
          set -o pipefail
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/structures/native.txt
          cargo build --locked --release --target wasm32-unknown-unknown -p blended-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structures-test-evidence
          path: |
            evidence/structures/
            compatibility/structure-ports.json
            crates/blended-core/src/structure_cases.rs
            crates/blended-core/tests/upstream_structures.rs
          retention-days: 3
      - name: Retain generated translations only after native execution succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git add crates/blended-core/src/structure_cases.rs crates/blended-core/tests/upstream_structures.rs compatibility/structure-ports.json tests/upstream/blender/BLI_index_range_test.cc tests/upstream/blender/BLI_binary_search_test.cc tests/upstream/blender/BLI_bounds_test.cc
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Retain 54 native-tested Blender structure ports and source snapshots'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
