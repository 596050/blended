name: Range and bounds test-port TDD
on:
  push:
    branches: [compat/ranges-bounds]
    paths: ['tools/port_structure_tests.py', 'crates/**', '.github/workflows/structure-port.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - run: |
          python3 tools/fetch_upstreams.py blender
          python3 tools/port_structure_tests.py
      - name: Execute all new ports with their original assertions
        run: |
          mkdir -p evidence/structures
          set -o pipefail
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/structures/native.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structures-test-evidence
          path: |
            evidence/structures/
            compatibility/structure-ports.json
            crates/blended-core/src/structure_cases.rs
            crates/blended-core/tests/upstream_structures.rs
          retention-days: 3
