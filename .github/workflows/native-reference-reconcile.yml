name: Reconcile preserved native Blender evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read immutable raw evidence rather than an expiring artifact
        uses: actions/checkout@v4
        with:
          ref: 07b2fd18d4fb15f83ddadbfb19acbd3a8a977bcb
          path: evidence/native-reference
          persist-credentials: false
      - name: Reconcile recorded execution without claiming a fresh native run
        run: |
          python3 -m unittest discover -s tests -p test_reference_inventory.py -v
          test "$(cat evidence/native-reference/run-id.txt)" = 39858339699
          test "$(cat evidence/native-reference/project-commit.txt)" = 5e7f17ef9bb45140090e4cb037f34e8df65b5ecd
          rm evidence/native-reference/runtime-reconciliation.json
          python3 tools/reference_inventory.py --evidence evidence/native-reference --output evidence/recomputed-reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recomputed-native-reference-report
          path: evidence/recomputed-reference.json
          retention-days: 3
