name: Reconcile actual native Blender test execution
on:
  push:
    branches: [compat/ranges-bounds]
    paths: ['tools/reference_inventory.py', '.github/workflows/native-reference-reconcile.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39858339699
          name: native-blender-reference-evidence
          path: evidence/native-reference
      - name: Preserve duplicate upstream registrations, never silently deduplicate
        run: |
          python3 -m unittest discover -s tests -p test_reference_inventory.py -v
          test "$(cat evidence/native-reference/run-id.txt)" = 39858339699
          test "$(cat evidence/native-reference/project-commit.txt)" = 5e7f17ef9bb45140090e4cb037f34e8df65b5ecd
          python3 tools/reference_inventory.py --evidence evidence/native-reference --output evidence/native-reference/runtime-reconciliation.json
          printf '%s\n' '${{ github.sha }}' > evidence/native-reference/reconciliation-tool-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciled-native-reference
          path: evidence/native-reference/
          retention-days: 3
      - name: Preserve original native logs, XML and scoped reconciliation durably
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init --initial-branch=native-reference-evidence published
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin native-reference-evidence >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin native-reference-evidence
            git -C published reset --mixed FETCH_HEAD
          fi
          cp -a evidence/native-reference/. published/
          git -C published add -A
          git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m 'Preserve actual BLI runtime discovery and 54 passing reference cases; retain ambiguous stack.Peek registrations'
          git -C published push origin HEAD:refs/heads/native-reference-evidence
