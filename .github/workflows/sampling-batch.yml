name: Compile and register the image and curve test ports
on:
  push:
    branches: [compat/sampling-curves]
    paths: ['tools/register_sampling_batch.py', 'tools/port_sampling_tests.py', 'crates/blended-core/src/image_sampling.rs', 'crates/blended-core/src/curve_sampling.rs', '.github/workflows/sampling-batch.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Reproduce and register the source-locked test families
        run: |
          set -euo pipefail
          python3 tools/fetch_upstreams.py blender
          python3 tools/register_sampling_batch.py
          mkdir -p evidence/sampling-integration
      - name: Execute the full native suite and freshly compile WebAssembly
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/sampling-integration/native.txt
          cargo build --locked --release --target wasm32-unknown-unknown -p blended-core 2>&1 | tee evidence/sampling-integration/wasm-build.txt
          python3 tools/prepare_site.py
          python3 -m unittest discover -s tests -v 2>&1 | tee evidence/sampling-integration/infrastructure.txt
      - name: Commit content only after compilation passes; fidelity and deployment remain separate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add crates tools tests compatibility evidence/sampling-integration
          gh auth setup-git
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m 'Register 36 source-locked sampling tests after native execution; independent C++ and deployed checks still required'
          git push origin HEAD:refs/heads/compat/sampling-curves
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sampling-integration-evidence
          path: |
            evidence/sampling-integration/
            compatibility/sampling-ports.json
            compatibility/curve-ports.json
            crates/blended-core/src/sampling_cases.rs
            crates/blended-core/src/curve_cases.rs
          retention-days: 1
