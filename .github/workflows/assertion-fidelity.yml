name: Audit original Blender assertion fidelity
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the pinned reference and its real build dependencies
        run: |
          set -euo pipefail
          mkdir -p evidence/fidelity
          printf '%s\n' '${{ github.sha }}' > evidence/fidelity/reference-project-commit.txt
          clang --version > evidence/fidelity/compiler.txt
          python3 tools/fetch_upstreams.py blender
          git -C .upstream/blender rev-parse HEAD > evidence/fidelity/blender-commit.txt
          git -C .upstream/blender lfs install --local
          git -C .upstream/blender config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
          git -C .upstream/blender config lfs.https://projects.blender.org/blender/blender.git/info/lfs.access none
          GIT_TERMINAL_PROMPT=0 git -C .upstream/blender lfs pull --include='release/datafiles/**' --exclude=''
          GIT_LFS_SKIP_SMUDGE=1 git -C .upstream/blender submodule update --init --depth=1 --checkout lib/linux_x64
          git -C .upstream/blender/lib/linux_x64 rev-parse HEAD > evidence/fidelity/libraries-commit.txt
          git -C .upstream/blender/lib/linux_x64 lfs install --local
          git -C .upstream/blender/lib/linux_x64 config lfs.https://projects.blender.org/blender/lib-linux_x64.git/info/lfs.access none
          GIT_TERMINAL_PROMPT=0 git -C .upstream/blender/lib/linux_x64 lfs pull --include='' --exclude='llvm/**,usd/**,materialx/**,openvdb/**,openimagedenoise/**,embree/**,ffmpeg/**,osl/**,python/**,numpy/**,opencollada/**,alembic/**,openpgl/**'
      - name: Record assertions and independent observations without changing original test bodies
        run: |
          set -euo pipefail
          python3 tools/assertion_fidelity.py cpp --upstream .upstream/blender
          python3 -c "import sys;sys.path.insert(0,'tools');from port_workbench import expected_cases;print(':'.join(c['id'] for c in expected_cases()[0]))" > evidence/fidelity/filter.txt
          cmake -S .upstream/blender -B build/fidelity-reference -G Ninja \
            -C .upstream/blender/build_files/cmake/config/blender_lite.cmake \
            -C .upstream/blender/build_files/cmake/config/blender_headless.cmake \
            -DCMAKE_BUILD_TYPE=Release -DWITH_GTESTS=ON -DWITH_TESTS_BATCHED=OFF \
            -DWITH_PYTHON=OFF -DWITH_VULKAN_BACKEND=OFF -DWITH_GHOST_WAYLAND=OFF \
            -DWITH_COMPILER_ASAN=OFF > evidence/fidelity/configure.log 2>&1
          cmake --build build/fidelity-reference --target BLI_test -j 3 > evidence/fidelity/build.log 2>&1
          cp build/fidelity-reference/CMakeCache.txt evidence/fidelity/
          EXE="$PWD/build/fidelity-reference/bin/tests/BLI_test"
          LIBPATH=$(find "$PWD/.upstream/blender/lib/linux_x64" -type d \( -name lib -o -name lib64 \) -printf '%p:')
          export LD_LIBRARY_PATH="${LIBPATH}${LD_LIBRARY_PATH:-}"
          export BLENDED_ASSERTION_TRACE="$PWD/evidence/fidelity/reference.jsonl"
          export BLENDED_MASK_ORACLE="$PWD/evidence/fidelity/mask-reference.bin"
          sha256sum "$EXE" > evidence/fidelity/reference-binary-sha256.txt
          "$EXE" --gtest_filter="$(cat evidence/fidelity/filter.txt)" --gtest_output="xml:$PWD/evidence/fidelity/reference-results.xml" --test-assets-dir "$PWD/.upstream/blender/tests/files" --test-release-dir "$PWD/build/fidelity-reference/bin" > evidence/fidelity/reference-run.log 2>&1
          test -s evidence/fidelity/container-reference.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assertion-reference-evidence
          path: evidence/fidelity/
          retention-days: 1
  rust-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Test audit failure detection and the unmodified Rust suite
        run: |
          mkdir -p evidence/fidelity
          printf '%s\n' '${{ github.sha }}' > evidence/fidelity/rust-project-commit.txt
          python3 -m unittest discover -s tests -p test_assertion_fidelity.py -v
          python3 -m unittest discover -s tests -p test_fidelity_stream.py -v
          cargo test --locked --workspace --all-targets > evidence/fidelity/unmodified-native.txt 2>&1
      - name: Record every value in an explicit diagnostic shadow build
        run: |
          set -euo pipefail
          python3 tools/assertion_fidelity.py shadow --output build/fidelity-shadow
          (cd build/fidelity-shadow && cargo run --locked --quiet -p blended-core --example assertion_trace) > evidence/fidelity/native.jsonl
          (cd build/fidelity-shadow && cargo build --locked --release --target wasm32-unknown-unknown -p blended-core)
          python3 -m pip install playwright==1.57.0
          python3 tools/assertion_fidelity.py browser --wasm build/fidelity-shadow/target/wasm32-unknown-unknown/release/blended_core.wasm --output evidence/fidelity/browser.jsonl
      - name: Execute full original random-helper workload and independent set-expression corpus
        run: python3 tools/verify_mask_expression_oracle.py build --output evidence/fidelity
      - name: Observe map ordering and type-erased backing storage against an independent model
        run: python3 tools/verify_container_view_oracle.py build --output evidence/fidelity/container-oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assertion-rust-evidence
          path: evidence/fidelity/
          retention-days: 1
  compare-and-preserve:
    needs: [reference, rust-and-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: assertion-reference-evidence
          path: evidence/fidelity
      - uses: actions/download-artifact@v4
        with:
          name: assertion-rust-evidence
          path: evidence/fidelity
      - name: Reconcile every original assertion against native Rust
        run: |
          test "$(cat evidence/fidelity/reference-project-commit.txt)" = '${{ github.sha }}'
          test "$(cat evidence/fidelity/rust-project-commit.txt)" = '${{ github.sha }}'
          python3 tools/assertion_fidelity.py compare --reference evidence/fidelity/reference.jsonl --port evidence/fidelity/native.jsonl --output evidence/fidelity/native-comparison.json
      - name: Reconcile every original assertion against Chromium WebAssembly
        if: always()
        run: python3 tools/assertion_fidelity.py compare --reference evidence/fidelity/reference.jsonl --port evidence/fidelity/browser.jsonl --output evidence/fidelity/browser-comparison.json
      - name: Require exact original-C++ randomized inputs and expression results
        if: always()
        run: python3 tools/verify_mask_expression_oracle.py compare --reference evidence/fidelity/mask-reference.bin --root evidence/fidelity --output evidence/fidelity/mask-comparison.json
      - name: Require exact original-header map values, live aliases and pointer offsets
        if: always()
        run: python3 tools/verify_container_view_oracle.py compare --reference evidence/fidelity/container-reference.bin --root evidence/fidelity/container-oracle --output evidence/fidelity/container-comparison.json
      - name: Preserve every event in verified lossless compressed transcripts
        if: always()
        run: python3 tools/fidelity_stream.py evidence/fidelity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assertion-fidelity-comparisons
          path: evidence/fidelity/
          retention-days: 1
      - name: Preserve verified evidence in GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git init --initial-branch=assertion-fidelity-evidence published
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin assertion-fidelity-evidence >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin assertion-fidelity-evidence
            git -C published reset --mixed FETCH_HEAD
          fi
          mkdir -p "published/runs/${RUN_ID}"
          cp -a evidence/fidelity/. "published/runs/${RUN_ID}/"
          cp evidence/fidelity/*comparison.json published/
          printf '%s\n' '${{ github.sha }}' > published/verified-source-commit.txt
          git -C published add -A
          git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m 'Preserve original C++/Rust/browser assertions and independent mask/container observation evidence'
          git -C published push origin HEAD:refs/heads/assertion-fidelity-evidence
