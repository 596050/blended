name: Heap original-test-first evidence
on:
  push:
    branches: [compat/heaps-and-priority-queues]
    paths: ['tools/register_heap_batch.py', '.github/workflows/heap-test-first.yml']
permissions:
  contents: write
jobs:
  test-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Register the reviewed original tests before supplying implementation
        run: |
          set -euo pipefail
          test ! -f crates/blended-core/src/priority_heaps.rs
          python3 tools/fetch_upstreams.py blender
          python3 tools/register_heap_batch.py
      - name: Commit translated sources and mappings with execution still pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add crates tools compatibility tests/upstream
          gh auth setup-git
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Register 29 complete original heap and priority queue cases before implementation; execution pending'
          git push origin HEAD:refs/heads/compat/heaps-and-priority-queues
      - name: Execute the missing implementation without suppressing failure
        run: |
          set -euo pipefail
          mkdir -p evidence/heap-test-first
          git rev-parse HEAD > evidence/heap-test-first/source-commit.txt
          cargo test --locked --workspace --all-targets 2>&1 | tee evidence/heap-test-first/native.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heap-test-first-evidence
          path: evidence/heap-test-first/
          retention-days: 3
