name: Pinned Blender native reference
on:
  push:
    branches: [compat/ranges-bounds]
    paths: ['.github/workflows/native-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bli-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact reference, startup assets and pinned library submodule
        run: |
          set -euo pipefail
          mkdir -p evidence/native-reference
          clang --version > evidence/native-reference/compiler.txt
          printf '%s\n' '${{ github.sha }}' > evidence/native-reference/project-commit.txt
          printf '%s\n' '${{ github.run_id }}' > evidence/native-reference/run-id.txt
          python3 tools/fetch_upstreams.py blender
          git -C .upstream/blender rev-parse HEAD > evidence/native-reference/blender-commit.txt
          git -C .upstream/blender lfs install --local
          git -C .upstream/blender config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
          git -C .upstream/blender config lfs.https://projects.blender.org/blender/blender.git/info/lfs.access none
          GIT_TERMINAL_PROMPT=0 git -C .upstream/blender lfs pull --include='release/datafiles/**' --exclude=''
          GIT_LFS_SKIP_SMUDGE=1 git -C .upstream/blender submodule update --init --depth=1 --checkout lib/linux_x64
          git -C .upstream/blender/lib/linux_x64 rev-parse HEAD > evidence/native-reference/libraries-commit.txt
          git -C .upstream/blender/lib/linux_x64 lfs install --local
          git -C .upstream/blender/lib/linux_x64 config lfs.https://projects.blender.org/blender/lib-linux_x64.git/info/lfs.access none
          GIT_TERMINAL_PROMPT=0 git -C .upstream/blender/lib/linux_x64 lfs pull --include='' --exclude='llvm/**,usd/**,materialx/**,openvdb/**,openimagedenoise/**,embree/**,ffmpeg/**,osl/**,python/**,numpy/**,opencollada/**,alembic/**,openpgl/**'
      - name: Configure explicitly limited BLI reference, not full application coverage
        run: |
          set -o pipefail
          cmake -S .upstream/blender -B build/blender-reference -G Ninja \
            -C .upstream/blender/build_files/cmake/config/blender_lite.cmake \
            -C .upstream/blender/build_files/cmake/config/blender_headless.cmake \
            -DCMAKE_BUILD_TYPE=Release -DWITH_GTESTS=ON -DWITH_TESTS_BATCHED=OFF \
            -DWITH_PYTHON=OFF -DWITH_VULKAN_BACKEND=OFF -DWITH_GHOST_WAYLAND=OFF \
            -DWITH_COMPILER_ASAN=OFF 2>&1 | tee evidence/native-reference/configure.log
      - name: Build real upstream BLI tests without replacing test code
        run: |
          set -o pipefail
          cmake --build build/blender-reference --target BLI_test -j 3 2>&1 | tee evidence/native-reference/build.log
      - name: Enumerate real runtime cases and execute newly ported reference families
        run: |
          set -euo pipefail
          cp build/blender-reference/CMakeCache.txt evidence/native-reference/
          ctest --test-dir build/blender-reference --show-only=json-v1 > evidence/native-reference/ctest.json
          EXE=$(find build/blender-reference -type f -name BLI_test | head -1)
          test -n "$EXE"
          LIBPATH=$(find "$PWD/.upstream/blender/lib/linux_x64" -type d \( -name lib -o -name lib64 \) -printf '%p:')
          export LD_LIBRARY_PATH="${LIBPATH}${LD_LIBRARY_PATH:-}"
          ldd "$EXE" > evidence/native-reference/dynamic-libraries.txt
          if grep -q 'not found' evidence/native-reference/dynamic-libraries.txt; then cat evidence/native-reference/dynamic-libraries.txt; exit 1; fi
          sha256sum "$EXE" > evidence/native-reference/binary-sha256.txt
          "$EXE" --gtest_list_tests > evidence/native-reference/gtest-list.txt 2>evidence/native-reference/list-stderr.txt
          "$EXE" --gtest_filter='index_range.*:binary_search.*:bounds.*' \
            --gtest_output="xml:$PWD/evidence/native-reference/reference-results.xml" \
            --test-assets-dir "$PWD/.upstream/blender/tests/files" \
            --test-release-dir "$PWD/build/blender-reference/bin" > evidence/native-reference/run.log 2>&1
          python3 tools/reference_inventory.py --evidence evidence/native-reference --output evidence/native-reference/runtime-reconciliation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-blender-reference-evidence
          path: evidence/native-reference/
          retention-days: 3
      - name: Preserve real native discovery and execution evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init --initial-branch=native-reference-evidence published
          git -C published remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          if git -C published ls-remote --exit-code --heads origin native-reference-evidence >/dev/null 2>&1; then
            git -C published fetch --depth=1 origin native-reference-evidence
            git -C published reset --mixed FETCH_HEAD
          fi
          cp -a evidence/native-reference/. published/
          git -C published add -A
          git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m 'Preserve scoped native Blender BLI test discovery and reference results'
          git -C published push origin HEAD:refs/heads/native-reference-evidence
