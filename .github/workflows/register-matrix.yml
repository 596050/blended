name: Register matrix and embedded static ports
on:
  push:
    branches: [compat/numerics-and-text]
    paths: ['tools/install_matrix_batch.py', '.github/workflows/register-matrix.yml']
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: wasm32-unknown-unknown
      - name: Reproduce source-locked matrix assertions and compile-time contracts
        run: |
          set -euo pipefail
          python3 tools/fetch_upstreams.py blender
          python3 tools/install_matrix_batch.py
          python3 tools/prepare_site.py
          python3 -m unittest discover -s tests -v
          mkdir -p evidence/matrix-integration
          cargo test --locked --workspace --all-targets > evidence/matrix-integration/native.log 2>&1
          cargo build --locked --release --target wasm32-unknown-unknown -p blended-core
          python3 tools/verify_embedded_static_ports.py --output evidence/matrix-integration/embedded-static.json
          python3 tools/assertion_fidelity.py shadow --output build/matrix-shadow
          (cd build/matrix-shadow && cargo run --locked --quiet -p blended-core --example assertion_trace) > evidence/matrix-integration/native-trace.jsonl
      - name: Commit reviewed source changes, leaving original C++ fidelity pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git rm tools/install_matrix_batch.py
          git add tools crates compatibility tests evidence/matrix-integration
          gh auth setup-git
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Register matrix runtime ports and five embedded compile-time mappings; original-reference verification pending'
          git push origin HEAD:refs/heads/compat/numerics-and-text
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-registration-evidence
          path: evidence/matrix-integration/
          retention-days: 3
